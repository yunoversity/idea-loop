name: Trash pickup SMS reminder

on:
  schedule:
    # Thursday 6:00 PM America/Chicago. Two UTC crons cover DST; the script
    # itself checks Chicago local time and no-ops on the wrong one.
    - cron: "0 23 * * 4" # 6 PM CDT (summer)
    - cron: "0 0 * * 5"  # 6 PM CST (winter)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Print the message without sending"
        type: boolean
        default: false

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send trash reminder
        env:
          TRASH_SMS_TO: ${{ secrets.TRASH_SMS_TO }}
          TWILIO_ACCOUNT_SID: ${{ secrets.TWILIO_ACCOUNT_SID }}
          TWILIO_AUTH_TOKEN: ${{ secrets.TWILIO_AUTH_TOKEN }}
          TWILIO_FROM: ${{ secrets.TWILIO_FROM }}
          TEXTBELT_KEY: ${{ secrets.TEXTBELT_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          TRASH_SMS_EMAIL: ${{ secrets.TRASH_SMS_EMAIL }}
        run: python scripts/trash_reminder.py ${{ inputs.dry_run && '--dry-run' || '' }}
