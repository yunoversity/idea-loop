name: Daily Telegram digest

# Daily schedule removed 2026-08-23 at Anthony's request — the automated
# morning question digest wasn't adding value. Run manually from the
# Actions tab if a digest is ever wanted.
on:
  workflow_dispatch:

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Send digest
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python scripts/telegram_digest.py
